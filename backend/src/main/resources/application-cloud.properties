# First-owner bootstrap is closed by default in shared/cloud deployments.
# Set AURORA_BOOTSTRAP_ENABLED=true only during initial owner creation, then turn it off.
aurora.auth.bootstrap.enabled=${AURORA_BOOTSTRAP_ENABLED:false}

# Do not fail aggregate health when optional email delivery is intentionally disabled.
management.health.mail.enabled=${AURORA_MAIL_ENABLED:false}

# Persist generated project workspace files on a durable mounted volume.
aurora.projects.storage-path=${AURORA_PROJECTS_STORAGE_PATH:./data/project-workspaces}

# Isolated, disposable website preview build service.
aurora.preview.runner-url=${AURORA_PREVIEW_RUNNER_URL:http://preview-runner:8090}
aurora.preview.runner-token=${AURORA_PREVIEW_RUNNER_TOKEN:}
aurora.preview.signing-secret=${AURORA_PREVIEW_SIGNING_SECRET:}
