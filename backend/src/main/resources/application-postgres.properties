spring.datasource.url=${AURORA_DB_URL:jdbc:postgresql://localhost:5432/aurora}
spring.datasource.username=${AURORA_DB_USERNAME:aurora}
spring.datasource.password=${AURORA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL schema is managed exclusively by Flyway migrations.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.forward-headers-strategy=framework
