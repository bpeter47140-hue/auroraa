spring.application.name=aurora-backend
server.port=8080

# Persistent local H2 database. PostgreSQL profile is available for deployment.
spring.datasource.url=jdbc:h2:file:./data/aurora;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Mail delivery is optional in local development; do not mark the app unhealthy when disabled.
management.health.mail.enabled=${AURORA_MAIL_ENABLED:false}
info.app.name=Project AURORA
info.app.description=Autonomous business operating system
info.app.version=0.5.0

# AI provider settings are supplied at deployment time; never commit API keys.
aurora.ai.api-key=${AURORA_AI_API_KEY:}
aurora.ai.model=${AURORA_AI_MODEL:openai/gpt-4.1-mini}
aurora.ai.base-url=${AURORA_AI_BASE_URL:https://openrouter.ai/api/v1}
aurora.ai.monthly-request-limit=${AURORA_AI_MONTHLY_REQUEST_LIMIT:100}

# Conservative request limits for the private prototype.
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Gmail SMTP using a Google App Password. Keep credentials in the local .env only.
aurora.mail.enabled=${AURORA_MAIL_ENABLED:false}
aurora.mail.from=${AURORA_MAIL_FROM:}
aurora.app.base-url=${AURORA_APP_BASE_URL:http://localhost:5173}
spring.mail.host=${AURORA_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${AURORA_MAIL_PORT:587}
spring.mail.username=${AURORA_MAIL_USERNAME:}
spring.mail.password=${AURORA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Monetary AI budgets are disabled until explicitly configured. When enabled, every
# request reserves this maximum before dispatch; unknown provider costs remain held.
aurora.ai.platform-monthly-budget-usd=${AURORA_AI_PLATFORM_MONTHLY_BUDGET_USD:0}
aurora.ai.max-request-reservation-usd=${AURORA_AI_MAX_REQUEST_RESERVATION_USD:0}
