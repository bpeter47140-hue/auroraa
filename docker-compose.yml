services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aurora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres,cloud
      AURORA_DB_URL: jdbc:postgresql://database:5432/aurora
      AURORA_DB_USERNAME: aurora
      AURORA_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AURORA_BOOTSTRAP_ENABLED: ${AURORA_BOOTSTRAP_ENABLED:-false}
      AURORA_AI_API_KEY: ${AURORA_AI_API_KEY:-}
      AURORA_AI_MODEL: ${AURORA_AI_MODEL:-openrouter/free}
      AURORA_AI_BASE_URL: ${AURORA_AI_BASE_URL:-https://openrouter.ai/api/v1}
      AURORA_AI_MONTHLY_REQUEST_LIMIT: ${AURORA_AI_MONTHLY_REQUEST_LIMIT:-100}
      AURORA_AI_PLATFORM_MONTHLY_BUDGET_USD: ${AURORA_AI_PLATFORM_MONTHLY_BUDGET_USD:-0}
      AURORA_AI_MAX_REQUEST_RESERVATION_USD: ${AURORA_AI_MAX_REQUEST_RESERVATION_USD:-0}
      AURORA_MAIL_ENABLED: ${AURORA_MAIL_ENABLED:-false}
      AURORA_MAIL_HOST: ${AURORA_MAIL_HOST:-smtp.gmail.com}
      AURORA_MAIL_PORT: ${AURORA_MAIL_PORT:-587}
      AURORA_MAIL_FROM: ${AURORA_MAIL_FROM:-}
      AURORA_MAIL_USERNAME: ${AURORA_MAIL_USERNAME:-}
      AURORA_MAIL_PASSWORD: ${AURORA_MAIL_PASSWORD:-}
      AURORA_APP_BASE_URL: ${AURORA_APP_BASE_URL:-http://localhost:8088}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # Bind only to loopback; public access goes through the optional Caddy profile.
      - "127.0.0.1:${AURORA_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    environment:
      AURORA_DOMAIN: ${AURORA_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  aurora-postgres:
  caddy-data:
  caddy-config:
