services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aurora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  preview-builder:
    image: aurora-preview-builder:1
    build:
      context: ./infrastructure/preview-runner
      dockerfile: builder.Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"

  preview-runner:
    build:
      context: ./infrastructure/preview-runner
      dockerfile: Dockerfile
    environment:
      PREVIEW_RUNNER_TOKEN: ${AURORA_PREVIEW_RUNNER_TOKEN:?Set AURORA_PREVIEW_RUNNER_TOKEN in .env}
      PREVIEW_DATA_PATH: /app/data/project-workspaces
      PREVIEW_BUILDER_IMAGE: aurora-preview-builder:1
    volumes:
      - aurora-project-workspaces:/app/data/project-workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # Match the host Docker socket group: stat -c %g /var/run/docker.sock
      - "${DOCKER_GID:-947}"
    networks:
      - preview-internal
    depends_on:
      preview-builder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  browser-qa:
    build: ./infrastructure/browser-qa
    environment:
      BROWSER_QA_TOKEN: ${AURORA_BROWSER_QA_TOKEN:?Set AURORA_BROWSER_QA_TOKEN in .env}
    networks:
      - qa-internal
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    mem_limit: 1200m
    cpus: 1.25
    pids_limit: 256
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres,cloud
      AURORA_DB_URL: jdbc:postgresql://database:5432/aurora
      AURORA_DB_USERNAME: aurora
      AURORA_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AURORA_BOOTSTRAP_ENABLED: ${AURORA_BOOTSTRAP_ENABLED:-false}
      AURORA_ALLOWED_ORIGINS: ${AURORA_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,https://auroraa-ggia.netlify.app}
      AURORA_AI_API_KEY: ${AURORA_AI_API_KEY:-}
      AURORA_AI_MODEL: ${AURORA_AI_MODEL:-openrouter/free}
      AURORA_AI_BASE_URL: ${AURORA_AI_BASE_URL:-https://openrouter.ai/api/v1}
      AURORA_AI_MONTHLY_REQUEST_LIMIT: ${AURORA_AI_MONTHLY_REQUEST_LIMIT:-100}
      AURORA_AI_PLATFORM_MONTHLY_BUDGET_USD: ${AURORA_AI_PLATFORM_MONTHLY_BUDGET_USD:-0}
      AURORA_AI_MAX_REQUEST_RESERVATION_USD: ${AURORA_AI_MAX_REQUEST_RESERVATION_USD:-0}
      AURORA_MAIL_ENABLED: ${AURORA_MAIL_ENABLED:-false}
      AURORA_MAIL_HOST: ${AURORA_MAIL_HOST:-smtp.gmail.com}
      AURORA_MAIL_PORT: ${AURORA_MAIL_PORT:-587}
      AURORA_MAIL_FROM: ${AURORA_MAIL_FROM:-}
      AURORA_MAIL_USERNAME: ${AURORA_MAIL_USERNAME:-}
      AURORA_MAIL_PASSWORD: ${AURORA_MAIL_PASSWORD:-}
      AURORA_APP_BASE_URL: ${AURORA_APP_BASE_URL:-http://localhost:8088}
      AURORA_PROJECTS_STORAGE_PATH: /app/data/project-workspaces
      AURORA_PREVIEW_RUNNER_URL: http://preview-runner:8090
      AURORA_PREVIEW_RUNNER_TOKEN: ${AURORA_PREVIEW_RUNNER_TOKEN:?Set AURORA_PREVIEW_RUNNER_TOKEN in .env}
      AURORA_PREVIEW_SIGNING_SECRET: ${AURORA_PREVIEW_SIGNING_SECRET:?Set AURORA_PREVIEW_SIGNING_SECRET in .env}
      AURORA_BROWSER_QA_URL: http://browser-qa:8091
      AURORA_BROWSER_QA_TOKEN: ${AURORA_BROWSER_QA_TOKEN:?Set AURORA_BROWSER_QA_TOKEN in .env}
    volumes:
      - aurora-project-workspaces:/app/data/project-workspaces
    networks:
      - default
      - preview-internal
      - qa-internal
    depends_on:
      database:
        condition: service_healthy
      preview-runner:
        condition: service_healthy
      browser-qa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${AURORA_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    environment:
      AURORA_DOMAIN: ${AURORA_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

networks:
  preview-internal:
    internal: true
  qa-internal:
    internal: true

volumes:
  aurora-postgres:
  aurora-project-workspaces:
  caddy-data:
  caddy-config:
