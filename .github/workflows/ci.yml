name: AURORA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate deployment shell scripts
        run: bash -n scripts/*.sh
      - name: Test public deployment preflight safety
        run: bash scripts/test-public-preflight.sh
      - name: Run backend tests
        run: cd backend && ./mvnw -B test

  postgres-startup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aurora
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package backend
        run: cd backend && ./mvnw -B -DskipTests package
      - name: Start application with PostgreSQL and Flyway
        env:
          SPRING_PROFILES_ACTIVE: postgres,cloud
          AURORA_DB_URL: jdbc:postgresql://localhost:5432/aurora
          AURORA_DB_USERNAME: aurora
          AURORA_DB_PASSWORD: aurora_ci_password
          AURORA_BOOTSTRAP_ENABLED: 'true'
          AURORA_AI_API_KEY: ''
        run: |
          java -jar backend/target/aurora-backend-0.0.1-SNAPSHOT.jar > /tmp/aurora.log 2>&1 &
          echo $! > /tmp/aurora.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health > /tmp/health.json; then
              cat /tmp/health.json
              curl --fail --silent http://localhost:8080/api/v1/auth/bootstrap
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/aurora.pid)" 2>/dev/null; then
              cat /tmp/aurora.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/aurora.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint dashboard
        run: cd frontend && npm run lint
      - name: Build dashboard
        run: cd frontend && npm run build

  container-build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: aurora_ci_only_not_a_secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build production backend and dashboard images
        run: docker compose build
      - name: Validate Nginx configuration in the dashboard image
        run: docker compose run --rm --no-deps dashboard nginx -t
      - name: Validate Caddy HTTPS ingress configuration
        run: |
          docker run --rm \
            -v "$PWD/infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e AURORA_DOMAIN=aurora.example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
