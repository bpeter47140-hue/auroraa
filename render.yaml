services:
  - type: web
    name: aurora-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: ohio
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres,cloud
      - key: AURORA_BOOTSTRAP_ENABLED
        value: "false"
      - key: AURORA_MAIL_ENABLED
        value: "true"
      - key: AURORA_AI_API_KEY
        sync: false
      - key: AURORA_AI_MODEL
        value: openrouter/free
      - key: AURORA_AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AURORA_DB_URL
        sync: false
      - key: AURORA_DB_USERNAME
        sync: false
      - key: AURORA_DB_PASSWORD
        sync: false
      - key: AURORA_ALLOWED_ORIGINS
        sync: false
      - key: AURORA_APP_BASE_URL
        sync: false
